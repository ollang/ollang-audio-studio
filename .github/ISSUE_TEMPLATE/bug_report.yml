name: Bug report
description: Report a reproducible problem in the local demo
body:
  - type: markdown
    attributes:
      value: Use synthetic audio and redact credentials, private IDs and signed URLs. For vulnerabilities, follow SECURITY.md instead of posting details here.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/architecture, browser, Docker/Compose or Node version, source version/snapshot
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command or UI steps and a short synthetic fixture if helpful.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
