name: Dependency security

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - Dockerfile
      - audio-service/**
      - .github/workflows/security.yml
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - Dockerfile
      - audio-service/**
      - .github/workflows/security.yml
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm audit --audit-level=high

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: studio-app
            context: .
          - image: studio-audio
            context: ./audio-service
    env:
      TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --pull -t ${{ matrix.image }} ${{ matrix.context }}
      - name: Record all image vulnerability findings
        run: |
          mkdir -p reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD/reports:/reports" \
            "$TRIVY_IMAGE" image --cache-dir /reports/cache --scanners vuln \
            --format json --output /reports/vulnerabilities.json "${{ matrix.image }}"
      - name: Block fixable high and critical image vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD/reports:/reports" \
            "$TRIVY_IMAGE" image --cache-dir /reports/cache --skip-db-update \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "${{ matrix.image }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-${{ matrix.image }}
          path: reports/vulnerabilities.json
          retention-days: 14
