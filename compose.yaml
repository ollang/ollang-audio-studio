services:
  app:
    build: .
    ports:
      - '127.0.0.1:${APP_PORT:-4310}:4310'
    environment:
      DETECTOR_URL: http://audio:4312
      OLLANG_API_KEY: ${OLLANG_API_KEY:-}
    volumes:
      - app-data:/data
    depends_on:
      audio:
        condition: service_started
    init: true
    mem_limit: 384m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4310/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
  audio:
    build: ./audio-service
    volumes:
      - whisper-models:/models
    init: true
    mem_limit: 1400m
    cpus: 1
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:4312/health'))['status']=='ready'",
        ]
      interval: 15s
      timeout: 3s
      start_period: 180s
      retries: 6
volumes:
  app-data:
  whisper-models:
